plugins {
    id 'com.android.library'
}
apply from: '../jacoco.gradle'

// Task to convert AAR (classes.jar) to DEX at build time for BioSDKLoader runtime loading.
// Standard AARs contain classes.jar (Java bytecode); Android runtime requires DEX format.
def biosdkAssetsDir = file("${projectDir}/src/main/assets/biosdk")
def biosdkDexOutputDir = file("${buildDir}/biosdk-dex/biosdk")

configurations { dexify }

tasks.register('dexifyBiosdkAars') {
    description = 'Convert AAR classes.jar to DEX format for runtime BioSDK loading'
    group = 'build'
    doLast {
        if (!biosdkAssetsDir.exists()) return
        def aarFiles = fileTree(biosdkAssetsDir).filter { it.name.endsWith('.aar') }.files

        def sdkDir = android.sdkDirectory
        def androidJar = new File(sdkDir, "platforms/${android.compileSdkVersion}/android.jar")
        if (!androidJar.exists()) {
            throw new GradleException("android.jar not found at ${androidJar}")
        }

        biosdkDexOutputDir.mkdirs()
        // Purge stale dex outputs when AARs are removed
        def aarBaseNames = aarFiles.collect { it.name.replaceAll('\\.aar$', '') } as Set
        biosdkDexOutputDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { f ->
            def jarBase = f.name.replaceAll('\\.jar$', '')
            if (!aarBaseNames.contains(jarBase)) {
                println "dexifyBiosdkAars: Removing stale output (no AAR): ${f.name}"
                f.delete()
            }
        }
        if (aarFiles.isEmpty()) return

        def workDir = file("${buildDir}/biosdk-dex/work")
        workDir.mkdirs()

        aarFiles.each { aarFile ->
            def baseName = aarFile.name.replaceAll('\\.aar$', '')
            def vendorJar = new File(biosdkAssetsDir, "${baseName}.jar")
            def outputJar = new File(biosdkDexOutputDir, "${baseName}.jar")
            if (vendorJar.exists()) {
                println "dexifyBiosdkAars: Vendor provided ${baseName}.jar (DEX already), skipping AAR conversion"
                if (outputJar.exists()) outputJar.delete()
                return
            }
            if (outputJar.exists() && outputJar.lastModified() >= aarFile.lastModified()) {
                println "dexifyBiosdkAars: ${baseName}.jar up to date, skipping"
                return
            }
            println "dexifyBiosdkAars: Converting ${aarFile.name} -> ${baseName}.jar"

            // Extract classes.jar from AAR (AAR has classes.jar at root or in jars/)
            def classesJar = new File(workDir, "${baseName}-classes.jar")
            def extractDir = new File(workDir, "extract-${baseName}")
            project.delete(extractDir)
            extractDir.mkdirs()
            project.copy {
                from project.zipTree(aarFile)
                into extractDir
            }
            def srcJar = new File(extractDir, 'classes.jar')
            if (!srcJar.exists()) srcJar = new File(extractDir, 'jars/classes.jar')
            if (!srcJar.exists()) {
                println "dexifyBiosdkAars: No classes.jar in ${aarFile.name}, skipping"
                return
            }
            project.copy { from srcJar; into workDir; rename { "${baseName}-classes.jar" } }

            def dexOutDir = new File(workDir, "${baseName}-dex")
            project.delete(dexOutDir)
            dexOutDir.mkdirs()
            javaexec {
                classpath = configurations.dexify
                mainClass = 'com.android.tools.r8.D8'
                args = [
                    '--output', dexOutDir,
                    '--lib', androidJar,
                    '--min-api', android.defaultConfig.minSdkVersion.apiLevel,
                    classesJar
                ]
            }

            def dexFile = new File(dexOutDir, 'classes.dex')
            if (!dexFile.exists()) {
                throw new GradleException("D8 did not produce classes.dex for ${aarFile.name}")
            }

            // Create JAR containing classes.dex (DexClassLoader accepts JAR with classes.dex)
            outputJar.delete()
            project.ant.jar(destfile: outputJar) {
                zipfileset(dir: dexOutDir, includes: '*.dex')
            }
            println "dexifyBiosdkAars: Created ${outputJar.name}"
        }
    }
}

android {
    namespace 'io.mosip.registration.clientmanager'
    lintOptions {
        abortOnError false
        ignoreWarnings true
    }
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        versionCode 1
        versionName "1.0"
        buildConfigField("String", "CLIENT_VERSION", rootProject.ext.clientmanagerLibVersionName)
        buildConfigField("String", "BASE_URL", rootProject.ext.serverBaseURL)
        buildConfigField("String", "DEBUG_PASSWORD", rootProject.ext.debugPassword)
        buildConfigField("long", "HTTP_READ_TIMEOUT", "${rootProject.ext.httpReadTimeout}L")
        buildConfigField("long", "HTTP_WRITE_TIMEOUT", "${rootProject.ext.httpWriteTimeout}L")
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets {
        main {
            assets {
                // Prepend dexified output so DEX-JAR takes precedence over raw AAR
                srcDirs "${buildDir}/biosdk-dex/biosdk", 'src/main/assets'
            }
        }
    }

    libraryVariants.every { variant ->
        variant.outputs.each { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.aar')) {
                output.outputFile = new File(projectDir, '../app/new_libs/' + outputFile.name)
            }
        }
    }
}

// Run dexify before clientmanager merges assets
afterEvaluate {
    ['mergeDebugAssets', 'mergeReleaseAssets'].each { taskName ->
        tasks.findByName(taskName)?.dependsOn(dexifyBiosdkAars)
    }
}

dependencies {
    // R8/D8 for dexifyBiosdkAars task (DEX conversion)
    dexify "com.android.tools:r8:${rootProject.ext.r8Version}"

    implementation "com.google.dagger:dagger:${rootProject.ext.daggerVersion}"
    implementation "com.google.dagger:dagger-android-support:${rootProject.ext.daggerVersion}"
    annotationProcessor "com.google.dagger:dagger-compiler:${rootProject.ext.daggerVersion}"
    annotationProcessor "com.google.dagger:dagger-android-processor:${rootProject.ext.daggerVersion}"

    compileOnly "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"

    implementation "javax.validation:validation-api:${rootProject.ext.validationApiVersion}"
    implementation "com.cronutils:cron-utils:${rootProject.ext.cronUtilsVersion}"
    implementation "org.aspectj:aspectjrt:${rootProject.ext.aspectjrtVersion}"
    implementation "io.swagger.core.v3:swagger-annotations:${rootProject.ext.swaggerAnnotationsVersion}"

    implementation "androidx.room:room-runtime:${rootProject.ext.roomVersion}"
    annotationProcessor "androidx.room:room-compiler:${rootProject.ext.roomVersion}"

    implementation "net.zetetic:android-database-sqlcipher:${rootProject.ext.sqlcipherVersion}"
    implementation "androidx.security:security-crypto:${rootProject.ext.securityCryptoVersion}"

    implementation "org.json:json:${rootProject.ext.jsonVersion}"
    implementation "androidx.work:work-runtime:${rootProject.ext.workVersion}"

    implementation "com.squareup.retrofit2:retrofit:${rootProject.ext.retrofitVersion}"
    implementation "com.squareup.okio:okio:${rootProject.ext.okioVersion}"
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"
    implementation "com.squareup.retrofit2:converter-gson:${rootProject.ext.retrofitVersion}"

    implementation "com.auth0.android:jwtdecode:${rootProject.ext.jwtDecodeVersion}"

    implementation group: 'commons-io', name: 'commons-io', version: "${rootProject.ext.commonsIoVersion}"

    implementation "com.fasterxml.jackson.core:jackson-core:${rootProject.ext.jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${rootProject.ext.jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${rootProject.ext.jacksonVersion}"

    implementation "org.apache.velocity:velocity:${rootProject.ext.velocityVersion}"
    implementation "org.mvel:mvel2:${rootProject.ext.mvel2Version}"

    implementation("com.tom-roush:pdfbox-android:${rootProject.ext.pdfboxAndroidVersion}") {
        exclude group: 'org.bouncycastle'
    }

    implementation "com.github.Tgo1014:JP2ForAndroid:${rootProject.ext.jp2ForAndroidVersion}"

    implementation("io.mosip.biometric.util:biometrics-util:${rootProject.ext.biometricsUtilVersion}") {
        exclude group: 'org.springframework.boot'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'org.projectlombok'
        exclude group: 'org.openpnp'
    }

    implementation group: 'org.slf4j', name: 'slf4j-api', version: "${rootProject.ext.slf4jVersion}"

    implementation project(':packetmanager')
    implementation project(':keymanager')

    implementation "com.github.kenglxn.QRGen:android:${rootProject.ext.qrGenVersion}"
    implementation("io.mosip.kernel:kernel-biometrics-api:${rootProject.ext.kernelBiometricsApiVersion}") {
        transitive = false
    }
    implementation "com.google.code.gson:gson:${rootProject.ext.gsonVersion}"

    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    testImplementation "org.robolectric:robolectric:${rootProject.ext.robolectricVersion}"
    testImplementation "androidx.test:core:${rootProject.ext.androidxTestCoreVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitJupiterVersion}"
    testImplementation "org.springframework:spring-test:${rootProject.ext.springTestVersion}"
    testImplementation "org.slf4j:slf4j-simple:${rootProject.ext.slf4jSimpleVersion}"
    testImplementation "org.mockito:mockito-core:${rootProject.ext.mockitoCoreVersion}"

    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.espressoVersion}"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:${rootProject.ext.mockwebserverVersion}"
    androidTestImplementation "org.mockito:mockito-android:${rootProject.ext.mockitoAndroidVersion}"
}
