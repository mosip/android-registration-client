name: Android Registration-Client Manual Build

on:
  workflow_dispatch:
    inputs:
      serverBaseURL:
        description: "Enter Server Base URL"
        required: true
        default: "api-internal.sandbox.xyz.net"

jobs:

  dco-check:
    name: DCO Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DCO Check
        uses: docker://ghcr.io/viperproject/dco-check:latest
        with:
          args: "--signoff"

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: dco-check
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: +security-extended

      - name: Build for CodeQL (Android/Flutter)
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug || true
          ./gradlew assembleRelease || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [codeql]

    steps:
      - uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm install

      - name: Replace serverBaseURL dynamically
        run: |
          find . -type f -name "*build.gradle" -print0 | \
          xargs -0 sed -i "s|api-internal.sandbox.xyz.net|${{ github.event.inputs.serverBaseURL }}|g"

      - name: Build APK
        run: |
          cd client
          chmod +x gradlew
          ./gradlew assembleDebug
          ls app/build/outputs/apk/debug
          find -name '*.apk'

      - name: Upload Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./client/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
